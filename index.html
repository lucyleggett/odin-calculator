<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <style> @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');</style>
</head>
<body>
    <div id="calculator-body">
        <div id="display"></div>
        <div class="buttons">
            <div id="left-side">
                <div id="clear-row">
                    <button id="clear">C</button>
                    <button id="all-clear">AC</button>
                </div>
                <div id="number-rows">
                    <button class="number" id="7">7</button>
                    <button class="number" id="8">8</button>
                    <button class="number" id="9">9</button>
                    <button class="number" id="4">4</button>
                    <button class="number" id="5">5</button>
                    <button class="number" id="6">6</button>
                    <button class="number" id="1">1</button>
                    <button class="number" id="2">2</button>
                    <button class="number" id="3">3</button>
                    <button id="smiley">ILY</button>
                    <button class="number" id="0">0</button>
                    <button class="number" id="decimal">.</button>
                </div>
            </div>
            <div id="right-side">
                <div id="operator-column">
                    <button id="evaluate">=</button>
                    <button class="operator" id="add">+</button>
                    <button class="operator" id="subtract">-</button>
                    <button class="operator" id="multiply">×</button>
                    <button class="operator" id="divide">÷</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
